# Keep ForgeGradle's decompile step under the 6 GB budget the pack targets.
# parallel is off on purpose: two parallel workers double peak memory and this
# project has a single source set.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=false

